# AutomatedNamespace — per-namespace automation defaults: the default policy + automate
# toggle for each optimization product applied to a whole namespace.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: automatednamespaces.analysis.coolscaler.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    app.kubernetes.io/name: coolscaler
    app.kubernetes.io/part-of: coolscaler
spec:
  group: analysis.coolscaler.sh
  scope: Cluster
  conversion:
    strategy: None
  names:
    kind: AutomatedNamespace
    listKind: AutomatedNamespaceList
    plural: automatednamespaces
    singular: automatednamespace
    shortNames: [ans]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {}
      additionalPrinterColumns:
        - { name: RightsizePolicy, type: string, jsonPath: .spec.defaultRightsizePolicy, priority: 1, description: "Default rightsize policy" }
        - { name: RightsizeAuto, type: boolean, jsonPath: .spec.rightsizeOptimize, priority: 1, description: "Rightsize automation enabled" }
        - { name: ReplicasPolicy, type: string, jsonPath: .spec.defaultReplicasPolicy, priority: 1, description: "Default replicas policy" }
        - { name: ReplicasAuto, type: boolean, jsonPath: .spec.replicasOptimize, priority: 1, description: "Replicas automation enabled" }
        - { name: SpotPolicy, type: string, jsonPath: .spec.defaultSpotPolicy, priority: 1, description: "Default spot policy" }
        - { name: SpotAuto, type: boolean, jsonPath: .spec.spotOptimize, priority: 1, description: "Spot automation enabled" }
        - { name: GpuPolicy, type: string, jsonPath: .spec.defaultGpuPolicy, priority: 1, description: "Default GPU policy" }
        - { name: GpuAuto, type: boolean, jsonPath: .spec.gpuOptimize, priority: 1, description: "GPU automation enabled" }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                defaultRightsizePolicy: { type: string }
                rightsizeOptimize: { type: boolean, default: false }
                defaultReplicasPolicy: { type: string }
                replicasOptimize: { type: boolean, default: false }
                defaultSpotPolicy: { type: string }
                spotOptimize: { type: boolean, default: false }
                defaultGpuPolicy: { type: string }
                gpuOptimize: { type: boolean, default: false }
