# AutoHealing — OOM/CPU-stress step-up remediation: escalates resources by stepUpMultiplier on observed
# failures; status records the applied steps.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autohealings.analysis.coolscaler.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    app.kubernetes.io/name: coolscaler
    app.kubernetes.io/part-of: coolscaler
spec:
  group: analysis.coolscaler.sh
  scope: Namespaced
  conversion:
    strategy: None
  names: { kind: AutoHealing, listKind: AutoHealingList, plural: autohealings, singular: autohealing, shortNames: [ah] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {}
      additionalPrinterColumns:
        - { name: Type, type: string, jsonPath: .spec.type, priority: 1 }
        - { name: ValidUntil, type: string, jsonPath: .status.validUntil, priority: 1, description: "End time for the autohealing" }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                type: { type: string }
                stepUpMultiplier: { type: number, default: 1.2 }
                targetRef:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    kind: { type: string }
                    name: { type: string }
                    namespace: { type: string }
                    apiVersion: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
