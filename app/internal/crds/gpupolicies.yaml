# GpuPolicy — GPU compute/memory rightsizing: requestsConfigs keyed by gpu-compute / gpu-memory at high
# percentile + long window.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpupolicies.analysis.coolscaler.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    app.kubernetes.io/name: coolscaler
    app.kubernetes.io/part-of: coolscaler
spec:
  group: analysis.coolscaler.sh
  scope: Namespaced
  conversion:
    strategy: None
  names: { kind: GpuPolicy, listKind: GpuPolicyList, plural: gpupolicies, singular: gpupolicy, shortNames: [gpupolicy] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                requestsConfigs:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                gpuAutoHealing:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
