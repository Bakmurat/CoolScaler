# SpotPolicy — spot-suitability automation: how aggressively a workload is
# moved to spot capacity, with an on-demand floor and PDB-aware fallback.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: spotpolicies.analysis.coolscaler.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    app.kubernetes.io/name: coolscaler
    app.kubernetes.io/part-of: coolscaler
spec:
  group: analysis.coolscaler.sh
  scope: Namespaced
  conversion:
    strategy: None
  names:
    kind: SpotPolicy
    listKind: SpotPolicyList
    plural: spotpolicies
    singular: spotpolicy
    shortNames: [spotpolicy]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                targetSpotOptimizationPercentage: { type: integer, default: 0 }
                minimumPodsOnOnDemandNodes: { type: integer, default: 1 }
                fallbackToOd: { type: boolean, default: true }
                supportWorkloadsWithPdb: { type: boolean, default: true }
                keep: { type: boolean }
                enableSparkDecommissionArgsInjection: { type: boolean, default: false }
