# DownscaleConfiguration — sleep / scale-to-zero scheduler.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: downscaleconfigurations.analysis.coolscaler.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    app.kubernetes.io/name: coolscaler
    app.kubernetes.io/part-of: coolscaler
spec:
  group: analysis.coolscaler.sh
  scope: Namespaced
  conversion:
    strategy: None
  names: { kind: DownscaleConfiguration, listKind: DownscaleConfigurationList, plural: downscaleconfigurations, singular: downscaleconfiguration, shortNames: [downscaleconfig] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required: ["name"]
              x-kubernetes-validations:
                - rule: "!has(self.sleep) || !self.sleep || !has(self.replicas) || self.replicas == 0"
                  message: "replicas must be 0 when sleep is enabled"
                - rule: "!has(self.minReplicas) || self.minReplicas >= 1"
                  message: "minReplicas must be at least 1"
              properties:
                name: { type: string }
                enabled: { type: boolean, default: true }
                hpaEnabled: { type: boolean, default: true }
                nonHpaEnabled: { type: boolean, default: true }
                minReplicas: { type: integer, default: 1 }
                replicas: { type: integer, default: 1 }
                sleep: { type: boolean, default: false }
                schedule:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
