# HPAPolicy — Replicas Optimization policy: minReplicas strategy by
# general/predictable workloads + prediction (look-ahead) + CPU threshold
# optimization.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hpapolicies.analysis.coolscaler.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    app.kubernetes.io/name: coolscaler
    app.kubernetes.io/part-of: coolscaler
spec:
  group: analysis.coolscaler.sh
  scope: Namespaced
  conversion:
    strategy: None
  names:
    plural: hpapolicies
    singular: hpapolicy
    kind: HPAPolicy
    listKind: HPAPolicyList
    shortNames: [hpapolicy]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                policyOptimize:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                updatePolicy:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
