# DownscalerPolicy — scheduled downscale / sleep windows: drop replicas during off-hours
# by a weekly schedule, restoring them outside the window.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: downscalerpolicies.analysis.coolscaler.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    {{- include "coolscaler.labels" . | nindent 4 }}
spec:
  group: analysis.coolscaler.sh
  scope: Namespaced
  conversion:
    strategy: None
  names:
    kind: DownscalerPolicy
    listKind: DownscalerPolicyList
    plural: downscalerpolicies
    singular: downscalerpolicy
    shortNames: [dspolicy]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required: ["name"]
              x-kubernetes-validations:
                - rule: "!has(self.sleep) || !self.sleep || !has(self.replicas) || self.replicas == 0"
                  message: "replicas must be 0 when sleep is enabled"
                - rule: "!has(self.minReplicas) || self.minReplicas >= 1"
                  message: "minReplicas must be at least 1"
              properties:
                name: { type: string }
                replicas: { type: integer }
                minReplicas: { type: integer }
                sleep: { type: boolean }
                hpaEnabled: { type: boolean }
                nonHpaEnabled: { type: boolean }
                schedule:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      weeklyConfig:
                        type: object
                        properties:
                          beginTime: { type: string }
                          endTime: { type: string }
                          days:
                            type: array
                            items: { type: integer }
