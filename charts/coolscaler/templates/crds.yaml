# CoolScaler CRDs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policies.analysis.coolscaler.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  labels:
    {{- include "coolscaler.labels" . | nindent 4 }}
spec:
  group: analysis.coolscaler.sh
  scope: Namespaced
  conversion:
    strategy: None
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    singular: policy
    shortNames: ["policy"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                type:
                  type: string
                  enum: ["Optimize", "Schedule"]
                  default: "Optimize"
                window:
                  type: string
                  default: "24h"
                requestsConfigs:
                  type: object
                  properties:
                    cpu:
                      type: object
                      properties:
                        percentilePercentage: { type: integer, default: 93 }
                        headroomPercentage: { type: integer, default: 10 }
                        minAllowed: { type: string, default: "10m" }
                        maxAllowed: { type: string, default: "4" }
                    memory:
                      type: object
                      properties:
                        percentilePercentage: { type: integer, default: 93 }
                        headroomPercentage: { type: integer, default: 5 }
                        minAllowed: { type: string, default: "16Mi" }
                        maxAllowed: { type: string, default: "8Gi" }
                hpa:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  default: { manageHPA: true }
                  properties:
                    manageHPA: { type: boolean, default: true }
                policyOptimize:
                  type: object
                  # preserve nested extras (fastReaction, scaleOutPolicy, …)
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    rightSizePolicy:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        nodeCappingPolicy:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            nodeCappingAuto: { type: boolean, default: true }
                updatePolicy:
                  type: object
                  # preserve nested extras (inPlace, updateByTypeMode, evictionSchedule)
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    updateMode:
                      type: string
                      enum: ["Ongoing", "OnCreate", "Inplace"]
                      default: "Ongoing"
