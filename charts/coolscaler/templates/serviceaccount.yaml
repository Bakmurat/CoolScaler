apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coolscaler.serviceAccountName" . }}
  labels:
    {{- include "coolscaler.labels" . | nindent 4 }}
---
# Secondary identity for worker-style jobs; no RBAC is bound to it. Components
# learn its name from the COOLSCALER_WORKER_SA_NAME env var.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coolscaler-worker
  labels:
    {{- include "coolscaler.labels" . | nindent 4 }}
