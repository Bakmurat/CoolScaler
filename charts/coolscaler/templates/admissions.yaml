{{- if .Values.admissions.enabled -}}
{{- $certs := include "coolscaler.webhookCerts" . | fromYaml -}}
{{- $img := include "coolscaler.image" . -}}
{{- $sa := include "coolscaler.serviceAccountName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: coolscaler-admissions-tls
  labels:
    {{- include "coolscaler.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $certs.ca }}
  tls.crt: {{ $certs.crt }}
  tls.key: {{ $certs.key }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolscaler-admissions
  labels:
    {{- include "coolscaler.labels" . | nindent 4 }}
    app.kubernetes.io/component: admissions
spec:
  replicas: 1
  # Zero-downtime webhook rollout: new pod must be Ready before the old one goes.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "coolscaler.selector" (dict "ctx" . "component" "admissions") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coolscaler.selector" (dict "ctx" . "component" "admissions") | nindent 8 }}
        {{- include "coolscaler.managedUnevictableLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- include "coolscaler.managedUnevictableAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $sa }}
      {{- include "coolscaler.priorityClassName" $ | nindent 6 }}
      {{- include "coolscaler.managedUnevictable" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: admissions
          image: {{ $img }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Certs come from the Helm-managed secret mounted at /tls; --gen-cert stays
          # available as fallback when absent.
          command:
            - /coolscaler
            - admissions-controller
            - --admissions-bind-port=8443
            - --health-probe-bind-address=:9999
            - --zap-log-level=error
          ports:
            - { name: webhook, containerPort: 8443 }
            - { name: http, containerPort: 8080 }
            - { name: probes, containerPort: 9999 }
          env:
            - { name: TLS_DIR, value: /tls }
            {{- include "coolscaler.commonEnv" . | nindent 12 }}
          readinessProbe: { httpGet: { path: /readyz, port: probes }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: probes }, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 15, failureThreshold: 8 }
          resources: {{- toYaml .Values.admissions.resources | nindent 12 }}
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret:
            secretName: coolscaler-admissions-tls
---
apiVersion: v1
kind: Service
metadata:
  name: coolscaler-admissions
  labels:
    {{- include "coolscaler.labels" . | nindent 4 }}
    app.kubernetes.io/component: admissions
spec:
  selector:
    {{- include "coolscaler.selector" (dict "ctx" . "component" "admissions") | nindent 4 }}
  ports:
    - { name: webhook, port: 443, targetPort: webhook }
    - { name: metrics, port: 8080, targetPort: http }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: coolscaler-mutating-webhook
  labels:
    {{- include "coolscaler.labels" . | nindent 4 }}
webhooks:
  - name: pods.coolscaler.sh
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    # a sidecar injector mutated the pod).
    matchPolicy: Equivalent
    timeoutSeconds: 10
    reinvocationPolicy: IfNeeded
    clientConfig:
      service:
        name: coolscaler-admissions
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: 443
      caBundle: {{ $certs.ca }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
      # Rightsizing↔autoscaling coordination: the webhook sees HPA / ScaledObject UPDATEs and
      # marks them coolscaler-managed.
      - apiGroups: ["autoscaling"]
        apiVersions: ["v2"]
        operations: ["UPDATE"]
        resources: ["horizontalpodautoscalers"]
        scope: Namespaced
      - apiGroups: ["keda.sh"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["scaledobjects"]
        scope: Namespaced
    # Only opted-in namespaces, and never kube-system / the coolscaler ns itself.
    namespaceSelector:
      matchExpressions:
        - { key: coolscaler.sh/optimize, operator: In, values: ["true"] }
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: ["kube-system", {{ .Release.Namespace | quote }}] }
{{- end }}
